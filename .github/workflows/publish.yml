name: Publish to Maven Central

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Refuse to publish a SNAPSHOT version
        run: |
          if grep -q 'version = "[^"]*SNAPSHOT' build.gradle.kts; then
            echo "build.gradle.kts still has a SNAPSHOT version — bump it before tagging a release." >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build

      # Uploads the release to the Central Portal but does NOT press "Publish" there.
      # That's a deliberate manual step — see PUBLISHING.md — because releases on
      # Maven Central are immutable once published.
      - name: Publish to Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral
